name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Vite 8 needs Node 20.19+ or 22.12+: test the two current LTS lines.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:react
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:dist
      - run: pnpm check:package
      - run: bun test

  # The same browser flows with the React Compiler on and off.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [on, off]
    env:
      ARTISAN_COMPILER: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm e2e

  # The packed tarball installed in clean Vite apps (React 18 and 19).
  consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - run: node scripts/consumer-test.mjs ${{ matrix.react }} "$RUNNER_TEMP/consumer"
      - run: node scripts/consumer-browser.mjs "$RUNNER_TEMP/consumer/app"
