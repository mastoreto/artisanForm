name: Release

# Manual publish to npm of `artisanform` and the official kits
# (@beardartisans/ui-bootstrap, ui-mui, ui-tailwind, ui-scss), all at the same
# version. It authenticates with npm Trusted Publishing (OIDC): no token is
# stored, but each of the five packages must list this repository and this
# workflow file as a trusted publisher (docs/releasing.md). `dry-run` defaults
# to true: it runs every check and `npm publish --dry-run` for each package,
# and uploads nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        default: beta
      dry-run:
        description: Do not publish, only verify
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Real publishes only run from main
        if: ${{ !inputs.dry-run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Publish from main (develop -> main is the release step). Use dry-run elsewhere."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run build:kits
      - run: bun run typecheck:kits
      - run: bun run check:dist
      - run: bun run check:api
      - run: bun run check:package
      - run: bun run check:kits
      - run: bun run check:pack
      - run: bun run check:publish
      - run: bun test
      - name: Publish the core, then the kits
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # --ignore-scripts: the checks already ran in the steps above, and
          # the core's prepublishOnly would repeat them (under --dry-run its
          # nested `npm pack` writes no tarball, which breaks `attw --pack`).
          flags="--provenance --access public --tag $TAG --ignore-scripts"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          # The core goes first: the kits peer-depend on it.
          for dir in . packages/ui-bootstrap packages/ui-mui packages/ui-tailwind packages/ui-scss; do
            echo "::group::npm publish $dir"
            (cd "$dir" && npm publish $flags)
            echo "::endgroup::"
          done
