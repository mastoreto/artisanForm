name: Release

# Manual publish to npm of `artisanform` and the official kits
# (@artisanform/ui-bootstrap, ui-mui, ui-tailwind, ui-scss), all at the same
# version. Needs the repository secret NPM_TOKEN: a granular access token with
# read/write on all packages (the `artisanform` package and the @artisanform
# organization scope). `dry-run` defaults to true: it runs every check and
# `npm publish --dry-run` for each package, and uploads nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        default: beta
      dry-run:
        description: Do not publish, only verify
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - run: bun run build:kits
      - run: bun run typecheck:kits
      - run: bun run check:dist
      - run: bun run check:package
      - run: bun run check:kits
      - run: bun run check:pack
      - run: bun test
      - name: Publish the core, then the kits
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          flags="--provenance --access public --tag $TAG"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          # The core goes first: the kits peer-depend on it.
          for dir in . packages/ui-bootstrap packages/ui-mui packages/ui-tailwind packages/ui-scss; do
            echo "::group::npm publish $dir"
            (cd "$dir" && npm publish $flags)
            echo "::endgroup::"
          done
