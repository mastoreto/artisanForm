name: Docs

# Publishes the guides (Starlight site, en/es) and Storybook to GitHub Pages:
#   https://mastoreto.github.io/artisanForm/            the guides
#   https://mastoreto.github.io/artisanForm/storybook/  Storybook
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - apps/docs/**
      - src/**
      - .storybook/**
      - package.json
      - bun.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:docs
        env:
          DOCS_BASE: /artisanForm
          DOCS_SITE: https://mastoreto.github.io
          DOCS_STORYBOOK_URL: https://mastoreto.github.io/artisanForm/storybook/
      - run: bun run build-storybook
      - run: cp -r storybook-static apps/docs/dist/storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
